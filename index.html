<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel - Şiir Jeneratörü</title>
    
    <!-- Tailwind CSS (CDN üzerinden) -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome (İkonlar) -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
    
    <!-- html2canvas kütüphanesi -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <!-- Tailwind Yapılandırması -->
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        handwriting: ['Dancing Script', 'cursive'],
                    },
                    colors: {
                        rose: { 50: '#fff1f2', 100: '#ffe4e6', 200: '#fecdd3', 300: '#fda4af', 400: '#fb7185', 500: '#f43f5e', 600: '#e11d48', 700: '#be123c', 800: '#9f1239', 900: '#881337', },
                    },
                    animation: {
                        'pulse-slow': 'pulse 4s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'fade-in': 'fadeIn 1s ease-out forwards',
                        'slide-up': 'slideUp 0.8s ease-out forwards',
                    },
                    keyframes: {
                        fadeIn: {
                            '0%': { opacity: '0' },
                            '100%': { opacity: '1' },
                        },
                        slideUp: {
                            '0%': { opacity: '0', transform: 'translateY(30px)' },
                            '100%': { opacity: '1', transform: 'translateY(0)' },
                        }
                    }
                }
            }
        }
    </script>

    <!-- Harici CSS Dosyamız -->
    <link rel="stylesheet" href="style.css">
</head>

<body class="relative text-slate-800 transition-colors duration-500">
    
    <!-- Arka Plan Partikülleri -->
    <div class="particles" id="particles"></div>

    <!-- Müzik Kontrolü -->
    <button id="musicBtn" class="fixed top-4 right-4 z-50 w-10 h-10 rounded-full glass-card flex items-center justify-center text-rose-500 hover:scale-110 transition-transform shadow-lg cursor-pointer">
        <i class="fa-solid fa-music"></i>
    </button>
    <audio id="bgMusic" loop>
        <source src="https://assets.mixkit.co/music/preview/mixkit-romantic-piano-and-strings-594.mp3" type="audio/mpeg">
    </audio>

    <div class="container mx-auto px-4 py-12 min-h-screen flex flex-col justify-center relative z-10 max-w-3xl">
        
        <!-- Başlık -->
        <header class="text-center mb-10 animate-slide-up">
            <h1 class="font-handwriting text-5xl md:text-6xl text-rose-600 mb-3 drop-shadow-sm">Sana Özel...</h1>
            <p class="font-sans text-sm md:text-base text-slate-600 opacity-80">Ruhunu okşayacak, sadece ona ait mısralar.</p>
        </header>

        <!-- Giriş Formu -->
        <div id="inputSection" class="glass-card rounded-3xl p-6 md:p-10 shadow-2xl animate-fade-in border-t-4 border-rose-400">
            <div class="space-y-6">
                <!-- İsim -->
                <div>
                    <label class="block text-sm font-medium mb-2 pl-1"><i class="fa-solid fa-heart text-rose-500 mr-2"></i>Onun İsmi</label>
                    <input type="text" id="nameInput" placeholder="Örn: Ayşe" class="w-full px-5 py-4 rounded-2xl bg-white/70 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent transition-all shadow-inner font-sans text-lg">
                </div>

                <!-- Detay -->
                <div>
                    <label class="block text-sm font-medium mb-2 pl-1"><i class="fa-solid fa-star text-rose-500 mr-2"></i>Ona dair özel bir detay (Opsiyonel)</label>
                    <input type="text" id="detailInput" placeholder="Örn: Gülüşü çok güzel, gözleri kahverengi..." class="w-full px-5 py-3 rounded-2xl bg-white/70 border border-rose-200 focus:outline-none focus:ring-2 focus:ring-rose-400 focus:border-transparent transition-all shadow-inner font-sans text-sm">
                </div>

                <!-- Tema Seçimi -->
                <div>
                    <label class="block text-sm font-medium mb-3 pl-1"><i class="fa-solid fa-palette text-rose-500 mr-2"></i>Şiirin Duygusu</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3" id="themeButtons">
                        <button class="theme-btn active bg-rose-500 text-white py-3 rounded-xl font-medium shadow-md transition-all hover:bg-rose-600 scale-105" data-theme="Romantik">Romantik</button>
                        <button class="theme-btn bg-white/60 text-slate-700 py-3 rounded-xl font-medium shadow-sm transition-all hover:bg-rose-100" data-theme="Tutkulu">Tutkulu</button>
                        <button class="theme-btn bg-white/60 text-slate-700 py-3 rounded-xl font-medium shadow-sm transition-all hover:bg-rose-100" data-theme="Masalsı">Masalsı</button>
                        <button class="theme-btn bg-white/60 text-slate-700 py-3 rounded-xl font-medium shadow-sm transition-all hover:bg-rose-100" data-theme="Eğlenceli">Eğlenceli</button>
                    </div>
                </div>

                <!-- Oluştur Butonu -->
                <div class="pt-4">
                    <button id="generateBtn" class="w-full bg-gradient-to-r from-rose-500 to-pink-600 hover:from-rose-600 hover:to-pink-700 text-white font-bold py-4 rounded-2xl shadow-lg transform transition hover:-translate-y-1 hover:shadow-xl flex justify-center items-center gap-3 text-lg">
                        <i class="fa-solid fa-wand-magic-sparkles"></i>
                        <span>Şiiri Yazmaya Başla</span>
                    </button>
                </div>
            </div>
            
            <!-- Hata Mesajı Alanı -->
            <div id="errorMsgContainer" class="hidden mt-4 bg-red-50 border-l-4 border-red-500 p-4 rounded-md">
                <div class="flex">
                    <div class="flex-shrink-0">
                        <i class="fa-solid fa-circle-exclamation text-red-500"></i>
                    </div>
                    <div class="ml-3">
                        <p id="errorMsg" class="text-sm text-red-700"></p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Yükleniyor Ekranı -->
        <div id="loadingSection" class="hidden flex-col items-center justify-center py-12 animate-fade-in">
            <div class="relative w-24 h-24">
                <i class="fa-solid fa-heart text-rose-500 text-5xl absolute top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 animate-pulse-slow"></i>
                <div class="w-24 h-24 border-4 border-rose-200 border-t-rose-500 rounded-full animate-spin"></div>
            </div>
            <p class="mt-6 text-lg font-medium text-slate-600 font-handwriting text-2xl" id="loadingText">Sihirli kelimeler fısıldanıyor...</p>
        </div>

        <!-- Sonuç Ekranı -->
        <div id="resultSection" class="hidden animate-slide-up mt-8">
            
            <!-- Şiir Çerçevesi -->
            <div id="poemCard" class="bg-gradient-to-br from-[#fdfbfb] to-[#f4edeb] rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden border border-rose-100">
                
                <!-- Süslemeler -->
                <div class="absolute top-0 left-0 w-16 h-16 border-t-4 border-l-4 border-rose-300 rounded-tl-3xl opacity-50 m-4"></div>
                <div class="absolute bottom-0 right-0 w-16 h-16 border-b-4 border-r-4 border-rose-300 rounded-br-3xl opacity-50 m-4"></div>
                <i class="fa-solid fa-quote-left absolute top-8 left-8 text-4xl text-rose-200"></i>

                <!-- Hitap -->
                <h2 id="poemTitle" class="font-handwriting text-4xl md:text-5xl text-center text-rose-600 mb-8 mt-4 drop-shadow-sm"></h2>

                <!-- Şiir Metni -->
                <div class="min-h-[200px] flex items-center justify-center relative z-10">
                    <p id="poemContent" class="font-serif text-lg md:text-xl leading-loose text-slate-700 whitespace-pre-line text-center italic"></p>
                </div>
                
                <div class="mt-10 text-right pr-4">
                    <p class="font-handwriting text-2xl text-rose-500">- Sonsuz sevgilerle</p>
                </div>
            </div>

            <!-- Aksiyon Butonları -->
            <div class="flex flex-wrap justify-center gap-3 mt-8">
                <button id="readAloudBtn" class="flex items-center gap-2 px-5 py-3 rounded-full glass-card hover:bg-rose-50 transition-colors font-medium text-sm text-slate-700 shadow-sm">
                    <i class="fa-solid fa-volume-high text-rose-500"></i> Sesli Oku
                </button>
                
                <button id="copyBtn" class="flex items-center gap-2 px-5 py-3 rounded-full glass-card hover:bg-rose-50 transition-colors font-medium text-sm text-slate-700 shadow-sm">
                    <i class="fa-solid fa-copy text-rose-500"></i> Kopyala
                </button>
                
                <button id="downloadBtn" class="flex items-center gap-2 px-5 py-3 rounded-full bg-rose-500 hover:bg-rose-600 text-white transition-colors font-medium text-sm shadow-md">
                    <i class="fa-solid fa-download"></i> Resim İndir
                </button>

                <button id="resetBtn" class="flex items-center gap-2 px-5 py-3 rounded-full glass-card hover:bg-rose-50 transition-colors font-medium text-sm text-slate-700 shadow-sm">
                    <i class="fa-solid fa-arrow-rotate-left text-slate-400"></i> Yeni Yaz
                </button>
            </div>
            
            <p id="copyMsg" class="text-green-600 text-center mt-3 text-sm hidden font-medium">Panoya kopyalandı!</p>
        </div>
    </div>

    <!-- Harici JS Dosyamız -->
    <script src="app.js"></script>
</body>
</html>
