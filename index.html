<!DOCTYPE html>
<html lang="tr" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sana Özel - Şiir Jeneratörü</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- FontAwesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Inter:wght@300;400;500;600&family=Playfair+Display:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">

    <!-- html2canvas -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        serif: ['Playfair Display', 'serif'],
                        handwriting: ['Dancing Script', 'cursive'],
                    },
                    colors: {
                        rose: {
                            50: '#fff1f2',
                            100: '#ffe4e6',
                            400: '#fb7185',
                            500: '#f43f5e',
                            600: '#e11d48',
                        }
                    },
                    animation: {
                        'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
                        'float': 'float 6s ease-in-out infinite',
                    },
                    keyframes: {
                        float: {
                            '0%, 100%': { transform: 'translateY(0)' },
                            '50%': { transform: 'translateY(-10px)' },
                        }
                    }
                }
            }
        }
    </script>

    <style>
        body {
            background: linear-gradient(135deg, #fff1f2 0%, #ffe4e6 50%, #fecdd3 100%); 
            overflow-x: hidden;
        }

        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.9);
            box-shadow: 0 15px 35px -5px rgba(244, 63, 94, 0.15);
        }

        .heart-float {
            position: absolute;
            opacity: 0.25;
            pointer-events: none;
            color: #f43f5e;
            animation: float 6s ease-in-out infinite;
        }

        .bg-blob {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            opacity: 0.6;
        }

        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: transparent; }
        ::-webkit-scrollbar-thumb { background: #fecdd3; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #fda4af; }

        /* --- 4K PÜRÜZSÜZ VE DEVASA MELİKE ÖZEL KALP ANİMASYONLARI --- */
        .heart-path {
            fill: transparent;
            stroke: #ffffff;
            stroke-width: 15;
            stroke-dasharray: 2500; 
            stroke-dashoffset: 2500; 
            stroke-linecap: round;
            stroke-linejoin: round;
            /* DEVASA YEŞİL + BEYAZ PARLAMA */
            filter: drop-shadow(0 0 50px rgba(74, 222, 128, 1)) 
                    drop-shadow(0 0 110px rgba(74, 222, 128, 1)) 
                    drop-shadow(0 0 190px rgba(74, 222, 128, 0.9))
                    drop-shadow(0 0 280px rgba(74, 222, 128, 0.8));
        }

        .heart-text {
            fill: #000000;
            font-size: 160px;
            font-family: 'Playfair Display', serif;
            font-weight: bold;
            text-anchor: middle;
            opacity: 0;
            pointer-events: none;
        }

        .draw-heart {
            animation: drawPath 3s ease forwards, fillPath 1s ease 2.5s forwards;
        }

        .show-text {
            animation: fadeInText 1s ease 3s forwards;
        }

        .pulse-group {
            animation: pulseHeart 2s ease 4s infinite;
        }

        @keyframes drawPath {
            0% { stroke-dashoffset: 2500; }
            100% { stroke-dashoffset: 0; }
        }

        @keyframes fillPath {
            0% { fill: transparent; }
            100% { fill: #ffffff; }
        }

        @keyframes fadeInText {
            0% { opacity: 0; transform: scale(0.8); }
            100% { opacity: 1; transform: scale(1); }
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        /* Dokunulunca uçuşan sihirli kalpler için stil */
        .magic-particle {
            position: absolute;
            pointer-events: none;
            animation: flyUp 1.5s ease-out forwards;
            z-index: 100;
        }

        @keyframes flyUp {
            0% { transform: translateY(0) scale(0.5); opacity: 1; }
            100% { transform: translateY(-120px) scale(1.4); opacity: 0; }
        }
    </style>
</head>

<body class="relative min-h-screen text-slate-800 flex flex-col justify-between selection:bg-rose-200 selection:text-rose-900">

    <!-- İsmail Türüt - Nazlıcanım Müziği -->
    <audio id="bgMusic" loop src="./nazlicanim.mp3"></audio>
    <audio id="typewriterSound" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_51d2f83db5.mp3?filename=typewriter-1-105120.mp3"></audio>

    <div class="fixed inset-0 overflow-hidden pointer-events-none z-0">
        <div class="bg-blob bg-rose-300 w-96 h-96 rounded-full top-[-10%] left-[-10%] mix-blend-multiply animate-pulse-slow"></div>
        <div class="bg-blob bg-pink-300 w-96 h-96 rounded-full bottom-[-10%] right-[-10%] mix-blend-multiply animate-pulse-slow" style="animation-delay: 2s;"></div>
        
        <i class="fa-solid fa-heart heart-float" style="top: 10%; left: 5%; font-size: 1.5rem; animation-delay: 0s;"></i>
        <i class="fa-solid fa-heart heart-float" style="top: 30%; right: 10%; font-size: 2rem; animation-delay: 2s;"></i>
        <i class="fa-solid fa-heart heart-float" style="bottom: 20%; left: 15%; font-size: 1rem; animation-delay: 1s;"></i>
        <i class="fa-solid fa-heart heart-float" style="bottom: 40%; right: 5%; font-size: 1.2rem; animation-delay: 3s;"></i>
    </div>

    <main class="relative z-10 w-full max-w-3xl mx-auto px-4 py-8 md:py-12 my-auto">
        
        <header class="text-center mb-10">
            <h1 class="font-handwriting text-5xl md:text-6xl text-rose-500 mb-2 drop-shadow-sm">Sana Özel...</h1>
            <p class="font-sans text-sm md:text-base text-slate-500 tracking-wide font-light">Ruhunu okşayacak, sadece ona ait mısralar.</p>
        </header>

        <div id="inputSection" class="glass-card rounded-3xl p-6 md:p-10 shadow-xl transition-all duration-500">
            <div class="space-y-6">
                
                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2 ml-1"><i class="fa-solid fa-heart text-rose-400 mr-2"></i>Onun İsmi</label>
                    <input type="text" id="nameInput" placeholder="Örn: Melike" value="Melike"
                        class="w-full px-5 py-4 rounded-2xl border border-rose-100 bg-white/50 text-slate-700 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-rose-300 focus:border-transparent transition-all shadow-inner font-sans text-lg">
                </div>

                <div>
                    <label class="block text-sm font-medium text-slate-600 mb-2 ml-1 mt-6"><i class="fa-solid fa-wand-magic-sparkles text-rose-400 mr-2"></i>Şiirin Havası</label>
                    <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                        <button class="theme-btn active bg-rose-500 text-white shadow-md shadow-rose-200/50 py-3 rounded-xl font-medium text-sm transition-all hover:-translate-y-0.5" data-theme="Romantik">Romantik</button>
                        <button class="theme-btn bg-white/60 text-slate-600 border border-slate-100 hover:bg-rose-50 py-3 rounded-xl font-medium text-sm transition-all" data-theme="Tutkulu">Tutkulu</button>
                        <button class="theme-btn bg-white/60 text-slate-600 border border-slate-100 hover:bg-rose-50 py-3 rounded-xl font-medium text-sm transition-all" data-theme="Eğlenceli">Eğlenceli</button>
                        <button class="theme-btn bg-white/60 text-slate-600 border border-slate-100 hover:bg-rose-50 py-3 rounded-xl font-medium text-sm transition-all" data-theme="Masalsı">Masalsı</button>
                    </div>
                </div>

                <div class="pt-4">
                    <button id="generateBtn" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-4 rounded-2xl font-semibold text-lg transition-all shadow-lg hover:shadow-xl flex items-center justify-center gap-3 group">
                        <span>Kalpten Dökül</span>
                        <i class="fa-solid fa-feather-pointed group-hover:rotate-12 transition-transform"></i>
                    </button>
                </div>

                <div id="errorMsgContainer" class="hidden mt-4 p-4 bg-red-50/80 border border-red-200 rounded-xl text-red-600 text-sm flex items-start gap-3">
                    <i class="fa-solid fa-circle-exclamation mt-0.5"></i>
                    <p id="errorMsg">Bir hata oluştu.</p>
                </div>
            </div>
        </div>

        <div id="loadingSection" class="hidden flex-col items-center justify-center py-16 space-y-6">
            <div class="relative w-20 h-20 flex items-center justify-center">
                <i class="fa-solid fa-envelope-open-text text-5xl text-rose-300 animate-pulse-slow"></i>
                <div class="absolute inset-0 rounded-full border-4 border-rose-100 border-t-rose-400 animate-spin"></div>
            </div>
            <p class="text-rose-500 font-medium font-sans animate-pulse">İlham perileri fısıldıyor, mısralar dökülüyor...</p>
        </div>

        <div id="resultSection" class="hidden space-y-6">
            
            <div id="poemPaper" class="glass-card rounded-3xl p-8 md:p-12 shadow-2xl relative overflow-hidden transition-all duration-500 border-2 border-rose-100 bg-[#fefcfc]">
                <div class="absolute top-0 right-0 w-32 h-32 bg-gradient-to-bl from-rose-100/40 to-transparent rounded-bl-full pointer-events-none"></div>
                <div class="absolute bottom-0 left-0 w-24 h-24 bg-gradient-to-tr from-rose-50/50 to-transparent rounded-tr-full pointer-events-none"></div>

                <div class="text-center mb-8 relative z-10">
                    <i class="fa-solid fa-quote-left text-3xl text-rose-200 mb-4 opacity-50"></i>
                    <h2 id="poemTitle" class="font-serif text-2xl md:text-3xl text-slate-800 font-semibold tracking-wide"></h2>
                </div>

                <div class="min-h-[200px] flex items-center justify-center px-2 relative z-10">
                    <div id="poemContent" class="font-serif text-lg md:text-xl leading-relaxed text-slate-700 whitespace-pre-line text-center italic"></div>
                </div>

                <div class="mt-10 pt-6 border-t border-rose-100/50 text-right relative z-10">
                    <p id="poemNote" class="font-handwriting text-2xl text-rose-500 opacity-90"></p>
                </div>
            </div>

            <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
                <button id="readAloudBtn" class="py-3 px-4 rounded-2xl glass-card text-sm font-semibold text-slate-700 hover:bg-white transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-volume-high text-rose-500"></i> Sesli Oku
                </button>
                <button id="copyBtn" class="py-3 px-4 rounded-2xl glass-card text-sm font-semibold text-slate-700 hover:bg-white transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-regular fa-copy text-rose-500"></i> Kopyala
                </button>
                <button id="downloadBtn" class="py-3 px-4 rounded-2xl bg-rose-500 hover:bg-rose-600 text-white text-sm font-semibold transition-all shadow-md flex items-center justify-center gap-2">
                    <i class="fa-solid fa-download"></i> Resim İndir
                </button>
                <button id="resetBtn" class="py-3 px-4 rounded-2xl glass-card text-sm font-semibold text-slate-700 hover:bg-white transition-all shadow-sm flex items-center justify-center gap-2">
                    <i class="fa-solid fa-rotate-left text-slate-400"></i> Yeni Yaz
                </button>
            </div>
            
            <p id="copyMsg" class="text-center text-emerald-600 text-sm font-medium opacity-0 transition-opacity">Şiir panoya kopyalandı! 💖</p>
        </div>

    </main>

    <footer class="relative z-10 p-4 flex justify-between items-end">
        <!-- Gizli Bahçe Kilit Butonu -->
        <button id="specialBtn" class="w-10 h-10 rounded-full bg-rose-500 text-white shadow-lg flex items-center justify-center hover:scale-110 transition-transform">
            <i class="fa-solid fa-lock text-sm"></i>
        </button>

        <button id="musicBtn" class="w-12 h-12 rounded-full glass-card text-slate-600 shadow-md flex items-center justify-center hover:bg-white transition-all z-20">
            <i class="fa-solid fa-music"></i>
        </button>
    </footer>

    <!-- Şifre Sorma Modalı -->
    <div id="passwordModal" class="fixed inset-0 z-50 bg-slate-900/40 backdrop-blur-sm hidden items-center justify-center opacity-0 transition-opacity duration-300">
        <div id="passwordCard" class="bg-white p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform duration-300">
            <div class="text-center mb-6">
                <i class="fa-solid fa-key text-3xl text-rose-400 mb-3"></i>
                <h3 class="text-xl font-bold text-slate-800 font-serif">Gizli Bahçe</h3>
                <p class="text-sm text-slate-500 mt-1">Bu sürprizi açmak için bugünün tarihini seçmelisin...</p>
            </div>
            
            <input type="date" id="datePassword" class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:border-rose-400 mb-4 text-slate-700">
            <p id="passwordError" class="text-red-500 text-xs text-center mb-4 hidden">Seçtiğin tarih yanlış aşkım, bugün seçmelisin.</p>
            
            <div class="flex gap-3">
                <button id="closePasswordBtn" class="flex-1 py-3 rounded-xl bg-slate-100 text-slate-600 font-medium hover:bg-slate-200 transition">İptal</button>
                <button id="unlockBtn" class="flex-1 py-3 rounded-xl bg-rose-500 text-white font-medium hover:bg-rose-600 transition shadow-md">Kilidi Aç</button>
            </div>
        </div>
    </div>

    <!-- Siyah-Pembe Atmosferli Kalp Ekranı -->
    <div id="secretHeartModal" class="fixed inset-0 z-[70] hidden items-center justify-center opacity-0 transition-opacity duration-1000" style="background: linear-gradient(135deg, #db2777 0%, #000000 100%);">
        <button id="closeSecretBtn" class="absolute top-6 right-6 text-white/50 hover:text-white text-3xl transition z-50">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="relative w-full p-4 flex items-center justify-center">
            
            <svg viewBox="0 0 1000 1000" class="w-80 h-80 md:w-[480px] md:h-[480px] overflow-visible">
                <g id="heartGroup" style="transform-origin: 500px 500px;">
                    <path class="heart-path" d="M 500 850 C 500 850 150 550 150 250 C 150 100 350 100 500 250 C 650 100 850 100 850 250 C 850 550 500 850 500 850 Z" />
                    <text x="500" y="470" class="heart-text">Melike</text>
                </g>
            </svg>

        </div>
    </div>

    <script>
        const apiKey = "AQ.Ab8RN6Ij5o4eGlm4NgtOMrxCvYvUObGzja4U1nNHpclkgjClZg";

        const nameInput = document.getElementById('nameInput');
        const themeButtons = document.querySelectorAll('.theme-btn');
        const generateBtn = document.getElementById('generateBtn');
        const loadingSection = document.getElementById('loadingSection');
        const resultSection = document.getElementById('resultSection');
        const inputSection = document.getElementById('inputSection');
        const poemTitle = document.getElementById('poemTitle');
        const poemContent = document.getElementById('poemContent');
        const poemNote = document.getElementById('poemNote');
        const errorMsgContainer = document.getElementById('errorMsgContainer');
        const errorMsg = document.getElementById('errorMsg');

        const readAloudBtn = document.getElementById('readAloudBtn');
        const copyBtn = document.getElementById('copyBtn');
        const downloadBtn = document.getElementById('downloadBtn');
        const resetBtn = document.getElementById('resetBtn');
        const copyMsg = document.getElementById('copyMsg');
        const musicBtn = document.getElementById('musicBtn');
        const bgMusic = document.getElementById('bgMusic');
        const typewriterSound = document.getElementById('typewriterSound');

        const specialBtn = document.getElementById('specialBtn');
        const passwordModal = document.getElementById('passwordModal');
        const passwordCard = document.getElementById('passwordCard');
        const closePasswordBtn = document.getElementById('closePasswordBtn');
        const unlockBtn = document.getElementById('unlockBtn');
        const datePassword = document.getElementById('datePassword');
        const passwordError = document.getElementById('passwordError');
        const secretHeartModal = document.getElementById('secretHeartModal');
        const closeSecretBtn = document.getElementById('closeSecretBtn');
        const heartPath = document.querySelector('.heart-path');
        const heartText = document.querySelector('.heart-text');
        const heartGroup = document.getElementById('heartGroup');

        // BUGÜNÜN TARİHİ OTOMATİK OLARAK ŞİFRE OLUR
        const getBugununTarihi = () => {
            const today = new Date();
            const offset = today.getTimezoneOffset();
            return new Date(today.getTime() - (offset * 60 * 1000)).toISOString().split('T')[0];
        };

        let selectedTheme = "Romantik";
        let isMusicPlaying = false;
        let heartAnimationTimeout; 
        
        typewriterSound.volume = 0.2;
        bgMusic.volume = 0.3;

        specialBtn.addEventListener('click', () => {
            passwordModal.classList.remove('hidden');
            passwordModal.classList.add('flex');
            setTimeout(() => {
                passwordModal.classList.remove('opacity-0');
                passwordCard.classList.remove('scale-95');
                passwordCard.classList.add('scale-100');
            }, 10);
            passwordError.classList.add('hidden');
            datePassword.value = "";
        });

        closePasswordBtn.addEventListener('click', () => {
            passwordModal.classList.add('opacity-0');
            passwordCard.classList.remove('scale-100');
            passwordCard.classList.add('scale-95');
            setTimeout(() => {
                passwordModal.classList.add('hidden');
                passwordModal.classList.remove('flex');
            }, 300);
        });

        unlockBtn.addEventListener('click', () => {
            const enteredDate = datePassword.value;
            if (!enteredDate) return;

            const dogruTarih = getBugununTarihi();

            if (enteredDate === dogruTarih) {
                passwordModal.classList.add('opacity-0');
                setTimeout(() => {
                    passwordModal.classList.add('hidden');
                    passwordModal.classList.remove('flex');
                    openSecretHeart();
                }, 300);
            } else {
                passwordError.classList.remove('hidden');
                passwordCard.classList.add('animate-pulse');
                setTimeout(() => passwordCard.classList.remove('animate-pulse'), 500);
            }
        });

        function openSecretHeart() {
            secretHeartModal.classList.remove('hidden');
            secretHeartModal.classList.add('flex');
            setTimeout(() => {
                secretHeartModal.classList.remove('opacity-0');
                playHeartAnimation(); 
            }, 10);
            if (!isMusicPlaying) musicBtn.click();
        }

        closeSecretBtn.addEventListener('click', () => {
            secretHeartModal.classList.add('opacity-0');
            setTimeout(() => {
                secretHeartModal.classList.add('hidden');
                secretHeartModal.classList.remove('flex');
                clearTimeout(heartAnimationTimeout); 
            }, 1000);
        });

        function playHeartAnimation() {
            heartPath.classList.remove('draw-heart');
            heartText.classList.remove('show-text');
            heartGroup.classList.remove('pulse-group');
            
            void heartPath.offsetWidth;
            
            heartPath.classList.add('draw-heart');
            heartText.classList.add('show-text');
            heartGroup.classList.add('pulse-group');
            
            setTimeout(() => {
                if('vibrate' in navigator) navigator.vibrate([100, 80, 100, 80, 150]); 
            }, 3500);

            heartAnimationTimeout = setTimeout(playHeartAnimation, 14000);
        }

        // DOKUNDUKÇA UÇUŞAN SİHİRLİ KALPLER
        function createParticle(x, y) {
            const particle = document.createElement('i');
            particle.className = 'fa-solid fa-heart magic-particle';
            const colors = ['#f472b6', '#4ade80', '#ffffff', '#fbcfe8'];
            particle.style.color = colors[Math.floor(Math.random() * colors.length)];
            particle.style.left = (x - 10) + 'px';
            particle.style.top = (y - 10) + 'px';
            particle.style.fontSize = (Math.random() * 1.5 + 0.8) + 'rem';
            
            document.body.appendChild(particle);
            setTimeout(() => particle.remove(), 1500);
        }

        secretHeartModal.addEventListener('click', (e) => {
            if(e.target.id !== 'closeSecretBtn' && e.target.closest('#closeSecretBtn') === null) {
                createParticle(e.clientX, e.clientY);
                createParticle(e.clientX + 25, e.clientY - 20);
            }
        });

        secretHeartModal.addEventListener('touchmove', (e) => {
            if (Math.random() > 0.4) createParticle(e.touches[0].clientX, e.touches[0].clientY);
        });

        themeButtons.forEach(btn => {
            btn.addEventListener('click', () => {
                themeButtons.forEach(b => {
                    b.classList.remove('active', 'bg-rose-500', 'text-white', 'shadow-md');
                    b.classList.add('bg-white/60', 'text-slate-600', 'border');
                });
                btn.classList.add('active', 'bg-rose-500', 'text-white', 'shadow-md');
                btn.classList.remove('bg-white/60', 'text-slate-600', 'border');
                selectedTheme = btn.dataset.theme;
            });
        });

        musicBtn.addEventListener('click', () => {
            if (isMusicPlaying) {
                bgMusic.pause();
                musicBtn.innerHTML = '<i class="fa-solid fa-music"></i>';
                musicBtn.classList.remove('bg-rose-100', 'text-rose-600');
            } else {
                bgMusic.play().catch(e => console.log(e));
                musicBtn.innerHTML = '<i class="fa-solid fa-volume-high"></i>';
                musicBtn.classList.add('bg-rose-100', 'text-rose-600');
            }
            isMusicPlaying = !isMusicPlaying;
        });

        generateBtn.addEventListener('click', async () => {
            const name = nameInput.value.trim();
            if (!name) {
                showError("Lütfen onun ismini yazmayı unutma.");
                nameInput.focus();
                return;
            }

            hideError();
            inputSection.classList.add('hidden');
            resultSection.classList.add('hidden');
            loadingSection.classList.remove('hidden');
            loadingSection.classList.add('flex');

            if (!isMusicPlaying) musicBtn.click();

            try {
                const prompt = `Yaratıcı, duygusal ve usta bir şairsin. 
                İsim: "${name}". 
                Tema/Duygu: "${selectedTheme}".
                Lütfen bu isme ve temaya uygun, kafiyeli, anlamlı ve çok etkileyici bir şiir yaz.
                Şiir en fazla 4 kıta olsun. Şiire uygun çok kısa bir başlık koy.
                Sonuç formatı: İlk satır başlık olsun, sonra boşluk, sonra şiir dizeleri. Başka hiçbir açıklama yazma.`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { temperature: 0.9, maxOutputTokens: 500 }
                    })
                });

                if (!response.ok) throw new Error(`API Hatası: ${response.status}`);
                
                const data = await response.json();
                if (!data.candidates || !data.candidates[0].content.parts[0].text) {
                    throw new Error("API yanıt formatı geçersiz.");
                }

                const poemText = data.candidates[0].content.parts[0].text.trim();
                displayPoem(name, poemText);

            } catch (error) {
                loadingSection.classList.add('hidden');
                loadingSection.classList.remove('flex');
                inputSection.classList.remove('hidden');
                showError("Şiir ilhamı şu an gelemedi, lütfen tekrar dene.");
                console.error(error);
            }
        });

        function displayPoem(name, fullText) {
            loadingSection.classList.add('hidden');
            loadingSection.classList.remove('flex');
            resultSection.classList.remove('hidden');
            
            poemContent.innerHTML = '';
            
            const lines = fullText.split('\n');
            let title = lines[0].replace(/\*/g, '').trim();
            let body = lines.slice(1).join('\n').trim();
            
            if(!body) {
                body = title;
                title = `${name} İçin...`;
            }

            poemTitle.textContent = title;
            poemNote.textContent = `- Sonsuz sevgilerle...`;

            typewriterSound.currentTime = 0;
            typewriterSound.play().catch(e=>console.log(e));
            
            let i = 0;
            const speed = 40; 

            function typeWriter() {
                if (i < body.length) {
                    if (body.charAt(i) === '\n') {
                        poemContent.innerHTML += '<br>';
                    } else {
                        poemContent.innerHTML += body.charAt(i);
                    }
                    i++;
                    setTimeout(typeWriter, speed);
                } else {
                    typewriterSound.pause();
                }
            }
            typeWriter();
        }

        resetBtn.addEventListener('click', () => {
            resultSection.classList.add('hidden');
            inputSection.classList.remove('hidden');
            poemContent.innerHTML = '';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        });

        copyBtn.addEventListener('click', () => {
            const textToCopy = `${poemTitle.textContent}\n\n${poemContent.innerText}\n\n${poemNote.textContent}`;
            navigator.clipboard.writeText(textToCopy).then(() => {
                copyMsg.classList.remove('opacity-0');
                setTimeout(() => copyMsg.classList.add('opacity-0'), 2500);
            });
        });

        readAloudBtn.addEventListener('click', () => {
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(poemContent.innerText);
                utterance.lang = 'tr-TR';
                utterance.rate = 0.85; 
                utterance.pitch = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        });

        downloadBtn.addEventListener('click', () => {
            const originalBorder = poemPaper.style.border;
            poemPaper.style.border = 'none';
            downloadBtn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Hazırlanıyor...';
            
            html2canvas(poemPaper, { scale: 2, backgroundColor: '#ffffff' }).then(canvas => {
                const link = document.createElement('a');
                link.download = 'Sana-Ozel-Siir.png';
                link.href = canvas.toDataURL('image/png');
                link.click();
                poemPaper.style.border = originalBorder;
                downloadBtn.innerHTML = '<i class="fa-solid fa-download"></i> Resim İndir';
            });
        });

        function showError(msg) {
            errorMsgContainer.classList.remove('hidden');
            errorMsg.textContent = msg;
        }

        function hideError() {
            errorMsgContainer.classList.add('hidden');
        }
    </script>
</body>
</html>
